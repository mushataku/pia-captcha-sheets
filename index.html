<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぴあ CAPTCHA 答え合わせ（キュー）</title>
<style>
  :root{
    --paper:#f6f7f9; --surface:#ffffff; --surface-2:#eef1f5;
    --ink:#161b22; --ink-2:#4d5766; --ink-3:#7a8494; --line:#d7dde6;
    --accent:#2f6db5; --accent-soft:#e3edf9; --done:#2c7a5b; --warn:#9a6a24; --warn-soft:#f7efe0;
    --shadow:0 1px 2px rgba(22,27,34,.06),0 4px 14px rgba(22,27,34,.05);
  }
  *{box-sizing:border-box}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
    line-height:1.5; margin:0; padding:0 16px 96px; max-width:1100px; margin-inline:auto;
  }
  header{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    margin-inline:-16px; padding:12px 16px; display:flex; flex-wrap:wrap; gap:8px 18px; align-items:baseline;
  }
  header h1{margin:0; font-size:17px; font-weight:700}
  header .stat{font-family:ui-monospace,"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-2)}
  header .stat b{color:var(--ink); font-weight:600}
  header a.boxeslink{margin-left:auto; font-size:12px; color:var(--ink-3); text-decoration:none}
  header a.boxeslink:hover{color:var(--accent)}

  section.box{margin-top:22px}
  section.box h2{
    font-size:13px; font-weight:600; color:var(--ink-2); margin:0 0 8px;
    font-family:ui-monospace,"IBM Plex Mono",monospace;
    display:flex; gap:10px; align-items:baseline;
  }
  section.box h2 .rest{color:var(--ink-3); font-weight:500}

  .cells{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .cell{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); padding:10px 10px 11px; display:flex; flex-direction:column; gap:8px;
  }
  .cell[data-state="ok"]{border-color:color-mix(in srgb,var(--done) 45%,var(--line)); opacity:.7}
  .cell[data-state="ok"]:focus-within{opacity:1}
  .cell[data-state="skip"]{border-color:color-mix(in srgb,var(--warn) 45%,var(--line)); background:var(--warn-soft); opacity:.7}
  .cell[data-state="gone"]{border-style:dashed; opacity:.6}
  .cell .sha{font-family:ui-monospace,monospace; font-size:10.5px; color:var(--ink-3)}
  .shot{background:#fff; border:1px solid var(--line); border-radius:6px; display:grid; place-items:center; padding:5px}
  .shot img{display:block; max-width:100%; width:100%; height:auto}
  .hint{
    display:flex; align-items:center; gap:7px; padding:4px 7px; border-radius:7px;
    background:var(--surface-2); border:1px solid var(--line);
  }
  .hint button{
    font:600 13px/1 ui-monospace,monospace; letter-spacing:.08em; background:none; border:0;
    color:var(--ink-2); cursor:pointer; padding:2px 3px;
  }
  .hint button:hover{color:var(--accent)}
  .hint .conf{font-family:ui-monospace,monospace; font-size:10.5px; color:var(--ink-3); margin-left:auto}
  .row{display:flex; gap:6px}
  input.ans{
    flex:1; min-width:0; font-family:ui-monospace,monospace; font-size:19px; font-weight:600;
    letter-spacing:.2em; text-align:center; padding:6px 4px; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--line); border-radius:7px;
  }
  input.ans:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  input.ans:disabled{opacity:.6}
  button.skip{
    font:500 11px/1 sans-serif; padding:0 9px; border:1px solid var(--line); border-radius:7px;
    background:var(--surface); color:var(--ink-3); cursor:pointer;
  }
  button.skip:hover{color:var(--warn); border-color:var(--warn)}
  .cell[data-state="skip"] button.skip{color:var(--warn); border-color:var(--warn); font-weight:600}
  .gone-note{font-size:11.5px; color:var(--warn); text-align:center}

  .sendbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter:blur(8px);
    border-top:1px solid var(--line); padding:10px 16px; display:flex; gap:10px; justify-content:center;
    flex-wrap:wrap;
  }
  .sendbar button{
    font:600 13px/1 sans-serif; padding:10px 18px; border-radius:9px; border:1px solid var(--accent);
    background:var(--accent); color:#fff; cursor:pointer;
  }
  .sendbar button:disabled{opacity:.4; cursor:default}
  .empty{color:var(--ink-3); font-size:13px; margin-top:30px; text-align:center}
</style>
</head>
<body>

<header>
  <h1>ぴあ CAPTCHA 答え合わせ（未回答キュー）</h1>
  <span class="stat">未回答 <b id="topCount">—</b> 件・最終更新 <b id="topUpdated">—</b></span>
  <a class="boxeslink" href="boxes.html">箱別シート（過去分）</a>
</header>

<main id="queue"></main>
<p class="empty" id="emptyNote" hidden>未回答の画像はいまありません。</p>

<div class="sendbar" id="sendbar"></div>

<script>
(function(){
  "use strict";
  var SHEETS_REPO = "mushataku/pia-captcha-sheets";
  var POLL_MS = 60000;
  var ISSUE_BODY_MAX_LEN = 7000;
  var ISSUE_CHUNK_SIZE = 100;
  var LS = "pia-queue-page-v1";

  var main = document.getElementById("queue");
  var topCount = document.getElementById("topCount");
  var topUpdated = document.getElementById("topUpdated");
  var emptyNote = document.getElementById("emptyNote");
  var sendbar = document.getElementById("sendbar");

  var state = {};       // sha8 -> {answer, unreadable, reviewed, sent, gone}
  var cells = {};       // sha8 -> DOM cell
  var boxSections = {}; // box_id -> DOM section
  var itemBySha = {};   // sha8 -> 最新のqueue.json item（gone後の表示用に保持）

  function localRead(){
    try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { return {}; }
  }
  function persist(){
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
  }
  state = localRead();

  function st(sha8){ return state[sha8] || (state[sha8] = {}); }

  // ---------- セル生成 ----------
  function buildCell(it){
    var cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.state = "todo";
    cell.dataset.sha8 = it.sha8;

    var sha = document.createElement("div");
    sha.className = "sha"; sha.textContent = it.sha8;

    var shot = document.createElement("div");
    shot.className = "shot";
    var img = document.createElement("img");
    img.src = it.img; img.loading = "lazy"; img.alt = "認証文字 " + it.sha8;
    shot.appendChild(img);

    var hint = document.createElement("div");
    hint.className = "hint";
    var gbtn = document.createElement("button");
    gbtn.type = "button"; gbtn.textContent = it.ai_pred;
    gbtn.title = "AIの予測を入力欄に入れる";
    var conf = document.createElement("span");
    conf.className = "conf"; conf.textContent = Math.round((it.ai_conf || 0) * 100) + "%";
    hint.appendChild(gbtn); hint.appendChild(conf);

    var row = document.createElement("div");
    row.className = "row";
    var inp = document.createElement("input");
    inp.className = "ans"; inp.type = "text"; inp.inputMode = "numeric";
    inp.autocomplete = "off"; inp.maxLength = 6;
    inp.placeholder = "6桁";
    var skip = document.createElement("button");
    skip.type = "button"; skip.className = "skip"; skip.textContent = "読めない";
    row.appendChild(inp); row.appendChild(skip);

    cell.appendChild(sha); cell.appendChild(shot); cell.appendChild(hint); cell.appendChild(row);

    var s = st(it.sha8);
    if (s.gone) {
      applyGoneUi(cell, it);
    } else {
      inp.value = s.answer || "";
      paint(cell, s);
    }

    gbtn.addEventListener("click", function(){
      inp.value = it.ai_pred; inp.dispatchEvent(new Event("input"));
      inp.focus({preventScroll:true});
    });
    inp.addEventListener("focus", function(){ inp.select(); });
    inp.addEventListener("input", function(){
      var v = inp.value.replace(/[^0-9]/g, "").slice(0, 6);
      if (v !== inp.value) inp.value = v;
      var s2 = st(it.sha8);
      s2.answer = v; s2.unreadable = false;
      s2.reviewed = v.length === 6;
      paint(cell, s2); tally(); persist();
      if (v.length === 6) focusNext(inp);
    });
    inp.addEventListener("keydown", function(e){
      if (e.key !== "Enter") return;
      e.preventDefault();
      var inputs = visibleInputs();
      var i = inputs.indexOf(inp);
      if (e.shiftKey) { if (i > 0) { inputs[i-1].focus(); inputs[i-1].select(); } return; }
      if (inp.value.length === 6 && i >= 0 && i + 1 < inputs.length) {
        inputs[i+1].focus(); inputs[i+1].select();
      }
    });
    skip.addEventListener("click", function(){
      var s2 = st(it.sha8);
      s2.unreadable = !s2.unreadable;
      if (s2.unreadable) { s2.answer = ""; s2.reviewed = true; inp.value = ""; }
      else { s2.reviewed = false; }
      paint(cell, s2); tally(); persist();
    });

    return cell;
  }

  function paint(cell, s){
    cell.dataset.state = s.unreadable ? "skip" : (s.reviewed ? "ok" : "todo");
    var inp = cell.querySelector("input.ans");
    if (inp) inp.disabled = false;
  }

  function applyGoneUi(cell, it){
    cell.dataset.state = "gone";
    var inp = cell.querySelector("input.ans");
    if (inp) { inp.disabled = true; inp.value = state[it.sha8].answer || ""; }
    var skipBtn = cell.querySelector("button.skip");
    if (skipBtn) skipBtn.disabled = true;
    if (!cell.querySelector(".gone-note")) {
      var note = document.createElement("div");
      note.className = "gone-note"; note.textContent = "他の人が回答済みです";
      cell.appendChild(note);
    }
  }

  function visibleInputs(){
    return Array.prototype.slice.call(main.querySelectorAll('.cell:not([data-state="gone"]) input.ans'));
  }
  function focusNext(fromInput){
    var inputs = visibleInputs();
    var i = inputs.indexOf(fromInput);
    if (i >= 0 && i + 1 < inputs.length) { inputs[i+1].focus(); inputs[i+1].select(); }
  }

  // ---------- queue.json との突き合わせ（reconcile） ----------
  function reconcile(data){
    var boxOrder = [];
    var itemsByBox = {};
    var seen = {};
    (data.items || []).forEach(function(it){
      if (!itemsByBox[it.box_id]) { itemsByBox[it.box_id] = []; boxOrder.push(it.box_id); }
      itemsByBox[it.box_id].push(it);
      seen[it.sha8] = true;
      itemBySha[it.sha8] = it;
    });

    // queue.jsonから消えた項目
    Object.keys(cells).forEach(function(sha8){
      if (seen[sha8]) return;
      var s = st(sha8);
      if (s.sent || !s.reviewed) {
        // 自分が送って取り込まれた・もともと未入力＝黙って消す
        var cell = cells[sha8];
        if (cell && cell.parentNode) cell.parentNode.removeChild(cell);
        delete cells[sha8];
        delete state[sha8];
      } else if (!s.gone) {
        s.gone = true;
        applyGoneUi(cells[sha8], itemBySha[sha8] || {sha8: sha8});
      }
    });
    persist();

    boxOrder.forEach(function(boxId){
      var sec = boxSections[boxId];
      if (!sec) {
        sec = document.createElement("section");
        sec.className = "box";
        sec.dataset.boxId = boxId;
        var h2 = document.createElement("h2");
        var list = document.createElement("div");
        list.className = "cells";
        sec.appendChild(h2); sec.appendChild(list);
        boxSections[boxId] = sec;
      }
      main.appendChild(sec);  // 末尾へ移動＝boxOrder(新しい順)どおりに並ぶ
      var list = sec.querySelector(".cells");
      itemsByBox[boxId].forEach(function(it){
        var cell = cells[it.sha8];
        if (!cell) { cell = buildCell(it); cells[it.sha8] = cell; }
        list.appendChild(cell);
      });
      var remaining = itemsByBox[boxId].filter(function(it){
        var s = state[it.sha8]; return !(s && s.reviewed);
      }).length;
      sec.querySelector("h2").innerHTML =
        boxHeadingHtml(itemsByBox[boxId][0].box_time, remaining);
    });

    // 空になった箱セクションは畳む（見出しは残っている="gone"セルだけの箱も一応残す）
    Object.keys(boxSections).forEach(function(boxId){
      var sec = boxSections[boxId];
      if (!sec.querySelector(".cells").children.length) {
        sec.remove(); delete boxSections[boxId];
      }
    });

    tally();
    topUpdated.textContent = new Date().toLocaleTimeString("ja-JP", {hour:"2-digit", minute:"2-digit"});
    emptyNote.hidden = !!Object.keys(cells).length;
  }

  function boxHeadingHtml(boxTime, remaining){
    return (boxTime || "") + " <span class=\"rest\">残り " + remaining + " 件</span>";
  }

  function tally(){
    var n = 0;
    Object.keys(cells).forEach(function(sha8){
      var s = state[sha8];
      if (!(s && (s.reviewed || s.gone))) n++;
    });
    topCount.textContent = n;
    renderSendbar();
  }

  // ---------- fetch ----------
  function loadQueue(){
    fetch("queue.json?t=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(reconcile)
      .catch(function(){ /* 一時的な取得失敗は次の60秒で回復する */ });
  }
  loadQueue();
  setInterval(loadQueue, POLL_MS);

  // ---------- 回答を送る ----------
  function buildBody(pairs){
    var lines = ["queue"];
    pairs.forEach(function(p){ lines.push(p[0] + " " + p[1]); });
    return lines.join("\n");
  }
  function splitBodies(pairs){
    if (!pairs.length) return [];
    var full = buildBody(pairs);
    if (full.length <= ISSUE_BODY_MAX_LEN || pairs.length <= ISSUE_CHUNK_SIZE) return [pairs];
    var chunks = [];
    for (var i = 0; i < pairs.length; i += ISSUE_CHUNK_SIZE) chunks.push(pairs.slice(i, i + ISSUE_CHUNK_SIZE));
    return chunks;
  }
  function collectPending(){
    var pairs = [];
    Object.keys(state).forEach(function(sha8){
      var s = state[sha8];
      if (s.reviewed && !s.sent && !s.gone) pairs.push([sha8, s.unreadable ? "?" : s.answer]);
    });
    return pairs;
  }
  function renderSendbar(){
    sendbar.innerHTML = "";
    var pairs = collectPending();
    if (!pairs.length) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = "回答を送る（0件）"; b.disabled = true;
      sendbar.appendChild(b);
      return;
    }
    var chunks = splitBodies(pairs);
    chunks.forEach(function(chunk, idx){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = chunks.length > 1
        ? "回答を送る " + (idx+1) + "/" + chunks.length + "（" + chunk.length + "件）"
        : "回答を送る（" + chunk.length + "件）";
      b.addEventListener("click", function(){
        var body = buildBody(chunk);
        var url = "https://github.com/" + SHEETS_REPO + "/issues/new"
          + "?title=" + encodeURIComponent("answers:queue")
          + "&labels=answers&body=" + encodeURIComponent(body);
        window.open(url, "_blank");
        chunk.forEach(function(p){ st(p[0]).sent = true; });
        persist();
        renderSendbar();
      });
      sendbar.appendChild(b);
    });
  }

  renderSendbar();
})();
</script>
</body>
</html>
