<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぴあ CAPTCHA 答え合わせ（キュー）</title>
<style>
  :root{
    --paper:#f6f7f9; --surface:#ffffff; --surface-2:#eef1f5;
    --ink:#161b22; --ink-2:#4d5766; --ink-3:#7a8494; --line:#d7dde6;
    --accent:#2f6db5; --accent-soft:#e3edf9; --done:#2c7a5b; --done-soft:#e3f2ea; --warn:#9a6a24; --warn-soft:#f7efe0;
    --diff:#b3401f;
    --shadow:0 1px 2px rgba(22,27,34,.06),0 4px 14px rgba(22,27,34,.05);
    --sendbar-h:96px;
  }
  *{box-sizing:border-box}
  html{scroll-padding-bottom:var(--sendbar-h)}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
    line-height:1.5; margin:0; padding:0 16px var(--sendbar-h);
  }
  header{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    margin-inline:-16px; padding:12px 16px; display:flex; flex-wrap:wrap; gap:6px 18px; align-items:baseline;
  }
  header h1{margin:0; font-size:17px; font-weight:700}
  header .stat{font-family:ui-monospace,"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-2)}
  header .stat b{color:var(--ink); font-weight:600}
  header a.boxeslink{margin-left:auto; font-size:12px; color:var(--ink-3); text-decoration:none}
  header a.boxeslink:hover{color:var(--accent)}
  header button.jump{
    font:600 12px/1 sans-serif; padding:5px 10px; border-radius:7px; border:1px solid var(--accent);
    background:var(--accent-soft); color:var(--accent); cursor:pointer;
  }
  header button.jump:disabled{opacity:.5; cursor:default}

  .sortbar{display:flex; gap:6px; align-items:baseline; flex-basis:100%; order:10}
  .sortbar .sortlabel{font-size:12px; color:var(--ink-3)}
  .sortopt{
    font:500 12px/1 sans-serif; padding:5px 10px; border-radius:7px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-2); cursor:pointer;
  }
  .sortopt[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}

  section.box{margin-top:18px}
  section.box h2{
    font-size:13px; font-weight:600; color:var(--ink-2); margin:0 0 8px;
    font-family:ui-monospace,"IBM Plex Mono",monospace;
    display:flex; gap:10px; align-items:baseline;
  }
  section.box h2 .rest{color:var(--ink-3); font-weight:500}

  /* 1画面の枚数を増やす: カードを小さくしauto-fillで列数を画面幅に合わせる
     （2026-09-15 拓也「画面遷移が律速」。目安=1920×1080で18枚以上・幅400は1列で崩れない） */
  .cells{display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .cell{
    background:var(--surface); border:1px solid var(--line); border-radius:9px;
    box-shadow:var(--shadow); padding:6px; display:flex; flex-direction:column; gap:0;
  }
  .cell[data-state="ok"]{border-color:var(--done); background:var(--done-soft)}
  .cell[data-state="ok"] .shot{opacity:.5}
  .cell[data-state="ok"]:focus-within .shot{opacity:1}
  .cell[data-state="ok"] input.ans{background:var(--surface)}
  .cell[data-state="ok"] .digits span{color:var(--done)}
  .cell:focus-within{box-shadow:0 0 0 2px var(--accent), var(--shadow)}  /* いま打っている札 */
  /* 「この画面の残りは全部合ってる」にマウスを乗せた/フォーカスしたときの対象プレビュー
     （2026-09-15 pia-queue-align-bottom-actions・押す前に対象が画面で分かる） */
  .cell.bulk-preview{box-shadow:0 0 0 2px var(--done), var(--shadow)}
  .cell[data-state="skip"]{border-color:color-mix(in srgb,var(--warn) 45%,var(--line)); background:var(--warn-soft); opacity:.7}
  .cell[data-state="ai"]{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .cell[data-state="ai"] .digits span{color:var(--accent)}
  .cell[data-state="gone"]{border-style:dashed; opacity:.6}
  .picked{font-family:ui-monospace,monospace; font-size:10.5px; color:var(--ink-3)}
  .picked:not(:empty){color:var(--done); font-weight:600}

  /* 画像: 隅に確信度・箱タグを重ねる（見出しの「✓…＝AI」・灰色の帯は廃止・2026-09-15） */
  .shot{position:relative; background:#fff; border:1px solid var(--line); border-radius:6px 6px 0 0; overflow:hidden; aspect-ratio:120/45}
  .shot img{display:block; width:100%; height:100%; object-fit:contain}
  .shot .conf, .shot .boxtag{
    position:absolute; top:2px; font-family:ui-monospace,monospace; font-size:9px; line-height:1.5;
    padding:1px 4px; border-radius:4px; background:rgba(255,255,255,.85); color:var(--ink-3);
  }
  .shot .conf{right:2px}
  .shot .boxtag{left:2px}
  .shot .boxtag[hidden]{display:none}

  /* 読みを画像の直下へ隙間なし・6桁を画像幅いっぱいに等間隔で広げる（2026-09-15）。
     本物の input と上に重ねる .digits は「同じ箱・同じ字送り」の宣言を共有する（2026-09-15
     pia-queue-align-bottom-actions: 旧版は .digits だけ flex の space-evenly・input は text-align:center の
     詰め書きで、全選択すると本物の値が6桁の真ん中に白抜きで浮き、クリックした桁と編集される桁もずれた）。
     近似で合わせず、同じ規則を2回適用する＝選択帯・キャレット・クリック位置が表示の桁と一致する。 */
  .ansWrap{position:relative; container-type:inline-size}
  input.ans, .digits{
    font-family:ui-monospace,monospace; font-size:19px; font-weight:600; line-height:normal;
    font-variant-numeric:tabular-nums; font-kerning:none; text-align:left; white-space:pre;
    letter-spacing:.8ch; padding:6px 2px 6px .8ch; border:1px solid transparent; border-top-width:0;
    --gap:.8ch;  /* 字間。下の選択の目印（.digits span.sel::before）が半ピッチの計算に使う */
  }
  @supports (width:1cqw){
    /* 等間隔は letter-spacing と padding-left を同じ --gap にして作る。100cqw＝入力欄の外寸・ch＝数字1字の幅。
       右端に数pxを残す＝末尾のキャレットで横スクロールが起きない（cqw を知らないブラウザは上の .8ch で揃う） */
    input.ans, .digits{--gap:calc((100cqw - 6ch - 8px) / 7); letter-spacing:var(--gap); padding-left:var(--gap)}
  }
  input.ans{
    display:block; width:100%; min-width:0; color:transparent; caret-color:var(--ink);
    background:var(--surface-2); border-color:var(--line); border-radius:0 0 7px 7px;
  }
  /* 選択中の文字にも color:transparent を効かせる（既定の ::selection は白抜きで描く）。文字は上の .digits が
     描く＝状態色・diff色がそのまま読める。帯も透明にする（2026-09-16 pia-queue-align-cont3-polish）: 入力欄
     自身の選択帯は letter-spacing のぶん各字の右へ伸び、「3」を選ぶと3と8の間の余白まで塗られて目印が右に
     ずれて見えた。選択の目印は下の .digits span.sel::before だけが描く */
  input.ans::selection{color:transparent; background:transparent}
  input.ans::placeholder{color:var(--ink-3); letter-spacing:normal}
  input.ans:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  input.ans:disabled{opacity:.6}
  /* AIの読みの表示は入力欄1つにまとめる＝下の色付き桁がプリフィル/入力値そのものを映す。
     人が直した桁だけAIの読みと違う色にする（.diff）。実データはtransparentな本物のinputが持つ
     （page.input_value等のテストはinputの値を見るので変わらない）。.digits は flex にしない＝
     通常のブロックの中の inline テキストで、input の中の文字と同じレイアウトを同じ規則で再現する。 */
  .digits{
    position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; color:var(--ink);
  }
  /* land前critic指摘・重大: `.cell[data-state="ok"] .digits span`等の状態別色(specificity 0,3,1)が
     `.digits span.diff`(0,2,1)に勝ち、人が直し終えた桁が一度も差分色にならなかった。
     診断色は状態色より必ず勝たせる（!important）。 */
  .digits span.diff{color:var(--diff) !important}
  /* 選択の目印（2026-09-16 pia-queue-align-cont3-polish で .digits 側に一本化）: span の箱は「字＋右側の
     letter-spacing」なので、箱の背景を塗ると帯が字の右へ半字間ずれる（cont2 の span.sel{background} も
     入力欄の ::selection と同じ向きにずれていた）。::before で「字の中心 ± 1ピッチの半分」を塗る＝字に
     対して左右対称で、隣り合う桁を選ぶと帯が切れ目なくつながる。z-index:-1＝.digits の文字の下に敷く。 */
  .digits span{position:relative}
  .digits span.sel::before{
    content:""; position:absolute; top:0; bottom:0; z-index:-1;
    left:calc(var(--gap) / -2); right:calc(var(--gap) / 2); background:rgba(47,109,181,.22);
  }

  .ctrlrow{display:flex; align-items:center; gap:5px; margin-top:5px}
  button.skip{
    font:500 10.5px/1 sans-serif; padding:4px 7px; border:1px solid var(--line); border-radius:6px;
    background:var(--surface); color:var(--ink-3); cursor:pointer;
  }
  button.skip:hover{color:var(--warn); border-color:var(--warn)}
  .cell[data-state="skip"] button.skip{color:var(--warn); border-color:var(--warn); font-weight:600}
  button.revert{
    font:500 10.5px/1 sans-serif; padding:4px 7px; border:1px solid var(--line); border-radius:6px;
    background:var(--surface); color:var(--ink-3); cursor:pointer;
  }
  button.revert:hover{color:var(--accent); border-color:var(--accent)}
  .gone-note{font-size:11px; color:var(--warn); text-align:center; margin-top:4px}

  .sendbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter:blur(8px);
    border-top:1px solid var(--line); padding:10px 16px; display:flex; gap:10px; justify-content:center;
    flex-wrap:wrap; align-items:center;
  }
  .sendbar button.send{
    font:600 13px/1 sans-serif; padding:10px 18px; border-radius:9px; border:1px solid var(--accent);
    background:var(--accent); color:#fff; cursor:pointer;
  }
  .sendbar button.send:disabled{opacity:.4; cursor:default}
  .sendbar button.resendall{
    font:500 11.5px/1.2 sans-serif; padding:8px 12px; border-radius:9px; border:1px dashed var(--warn);
    background:var(--warn-soft); color:var(--warn); cursor:pointer;
  }
  /* 途中送信・画面ごとの一括確認（もとはヘッダー固定。2026-09-15 pia-queue-align-bottom-actions で
     「回答を送る」と同じ送信バーへ移設＝「この画面」の境界を送信バーの上端に揃えるため）。
     大きさ・目立ち方は button.send と同格にする（旧 .jump 型にしない）。 */
  .sendbar button.act{
    font:600 13px/1 sans-serif; padding:10px 16px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-2); cursor:pointer;
  }
  .sendbar button.act:disabled{opacity:.4; cursor:default}
  .sendbar button#bulkConfirm{border-color:var(--done); background:var(--done-soft); color:var(--done)}
  .sendbar button#bulkUndo{border-color:var(--warn); background:var(--warn-soft); color:var(--warn)}
  .sendbar input.name{
    font:500 13px/1 sans-serif; padding:9px 10px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); width:9em;
  }
  /* 状態表示は1行だけ（2026-09-16 pia-queue-align-cont3-polish: 旧 #sendStatus と #actionStatus に
     「届きました（N件）」が2行並んでいた）。ボタンの行の下に置く（order＝ボタンの並びは動かさない）。
     空でも1行ぶんの高さを確保する（land前critic 中: 行が出たり消えたりすると固定バーの高さが変わって
     ボタンの行が上下にずれ、「回答を送る」のダブルクリックの2回目が上の「見えている未確認N件は合ってる」に
     当たって、人が見ていない札を確定していた） */
  .sendbar .barstatus{font-size:12.5px; line-height:1.5; min-height:1.5em; color:var(--done); font-weight:600;
    flex-basis:100%; text-align:center; order:1}
  .sendbar .barstatus[hidden]{display:block; visibility:hidden}
  .fallback{
    order:2;
    flex-basis:100%; background:var(--warn-soft); border:1px solid var(--warn); border-radius:9px;
    padding:10px; display:flex; flex-direction:column; gap:6px;
  }
  .fallback[hidden]{display:none}
  .fallback p{margin:0; font-size:12.5px; color:var(--warn); font-weight:600}
  .fallback textarea{
    width:100%; height:6em; font:12px/1.4 ui-monospace,monospace; border:1px solid var(--line);
    border-radius:7px; padding:6px; background:var(--surface); color:var(--ink);
  }
  .fallback button{
    align-self:flex-start; font:600 12px/1 sans-serif; padding:8px 12px; border-radius:7px;
    border:1px solid var(--warn); background:var(--surface); color:var(--warn); cursor:pointer;
  }
  .empty{color:var(--ink-3); font-size:13px; margin-top:30px; text-align:center}
</style>
</head>
<body>

<header>
  <h1>ぴあ CAPTCHA 答え合わせ（未回答キュー）</h1>
  <span class="stat">未確認 <b id="topCount">—</b> / 全 <b id="topTotal">—</b> 件・最終更新 <b id="topUpdated">—</b></span>
  <button type="button" class="jump" id="jumpTodo" title="並び順で最初の未確認の札の入力欄へ移る">未確認の先頭へ ▶</button>
  <a class="boxeslink" href="boxes.html">箱別シート（過去分）</a>
  <div class="sortbar" id="sortbar">
    <span class="sortlabel">並び替え:</span>
    <button type="button" class="sortopt" data-mode="conf_asc">確信度が低い順（既定）</button>
    <button type="button" class="sortopt" data-mode="conf_desc">確信度が高い順</button>
    <button type="button" class="sortopt" data-mode="box">最新の箱順</button>
  </div>
</header>

<main id="queue"></main>
<p class="empty" id="emptyNote" hidden>未回答の画像はいまありません。</p>

<div class="sendbar" id="sendbar">
  <button type="button" class="act" id="sendTop" hidden>ここまで送る（<span id="sendTopN">0</span>件）</button>
  <button type="button" class="act" id="bulkConfirm">この画面の残りは全部合ってる</button>
  <button type="button" class="act" id="bulkUndo" hidden>取り消す</button>
  <span class="barstatus" id="actionStatus" hidden></span>
</div>

<script>
(function(){
  "use strict";
  var SHEETS_REPO = "mushataku/pia-captcha-sheets";
  // 回答の送信先＝受け口（Cloud Run `pia-answers-inbox`・GitHub ログイン不要・
  // `measure/box_ingest.py` の ANSWERS_INBOX_URL と同じ値をテストで固定）
  var ANSWERS_INBOX_URL = "https://pia-answers-inbox-vlu26jpgea-an.a.run.app/";
  var POLL_MS = 60000;
  var INBOX_BODY_MAX_LEN = 30000;
  var INBOX_CHUNK_SIZE = 1500;
  var NAME_MAX_LEN = 40;
  var LS = "pia-queue-page-v1";
  var LS_MODE = "pia-queue-page-mode-v1";
  var LS_NAME = "pia-queue-page-name-v1";  // 任意の名前欄（state とは別キー＝state の形を変えない）
  var SORT_MODES = {conf_asc: 1, conf_desc: 1, box: 1};

  var main = document.getElementById("queue");
  var topCount = document.getElementById("topCount");
  var topUpdated = document.getElementById("topUpdated");
  var topTotal = document.getElementById("topTotal");
  var jumpTodo = document.getElementById("jumpTodo");
  var emptyNote = document.getElementById("emptyNote");
  var sendbar = document.getElementById("sendbar");
  var sortbar = document.getElementById("sortbar");
  var sendTop = document.getElementById("sendTop");
  var sendTopN = document.getElementById("sendTopN");
  var bulkConfirmBtn = document.getElementById("bulkConfirm");
  var bulkUndoBtn = document.getElementById("bulkUndo");
  var actionStatus = document.getElementById("actionStatus");

  var state = {};       // sha8 -> {answer, unreadable, reviewed, sent, gone, aiFilled}
  var cells = {};       // sha8 -> DOM cell
  var boxSections = {}; // box_id -> DOM section（並び替えmode="box"のときだけ使う）
  var flatList = null;  // 並び替えmode="conf_asc"/"conf_desc"のときの単一グリッド
  var itemBySha = {};   // sha8 -> 最新のqueue.json item（gone後の表示用に保持）

  function readMode(){
    try {
      var m = localStorage.getItem(LS_MODE);
      return SORT_MODES[m] ? m : "conf_asc";
    } catch (e) { return "conf_asc"; }
  }
  var currentMode = readMode();  // 既定=確信度が低い順（2026-09-14 拓也指示で既定化）

  function localRead(){
    try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { return {}; }
  }
  function persist(){
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
  }
  state = localRead();

  function st(sha8){ return state[sha8] || (state[sha8] = {}); }

  // 全角数字（日本語入力・全角貼り付け）を半角へ（2026-09-16 pia-queue-align-bottom-actions-cont2）
  function toHalfWidthDigits(s){
    return String(s).replace(/[０-９]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); });
  }
  var NAV_KEYS = {ArrowLeft: 1, ArrowRight: 1, ArrowUp: 1, ArrowDown: 1, Home: 1, End: 1, PageUp: 1, PageDown: 1};
  // 「全部打ち直す」扱いか＝欄が空か、6桁全部が選ばれている（自動で次の札へ進むのはこのときだけ）
  function selectionCoversAll(inp){
    return inp.value.length === 0 || (inp.selectionStart === 0 && inp.selectionEnd === inp.value.length);
  }
  // aiFilled=true＝AI予測をプリフィルしたまま人がまだ触っていない（送信対象には入る。paint()の見た目区別用）
  function cellIsHandled(s){ return !!(s && (s.gone || (s.reviewed && !s.aiFilled))); }

  // 入力欄の下に重ねる色付き桁（AIの読みと違う桁だけ色を変える＝人が直した箇所が分かる）。
  // 本物の値はtransparentな input.ans が持つ（テストの input_value 等はそのまま通る）。
  function syncDigits(cell, value){
    var digitsEl = cell.querySelector(".digits");
    if (!digitsEl) return;
    var aiPred = cell.dataset.aiPred || "";
    digitsEl.innerHTML = "";
    for (var i = 0; i < 6; i++) {
      var ch = (value || "")[i] || "";
      var span = document.createElement("span");
      span.textContent = ch;
      if (ch && aiPred[i] && ch !== aiPred[i]) span.className = "diff";
      digitsEl.appendChild(span);
    }
    syncSelectionMark();  // 桁を作り直すと選択の目印（.sel）が消える＝入力欄が選択中なら付け直す
  }

  // ---------- セル生成 ----------
  function buildCell(it){
    var cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.state = "todo";
    cell.dataset.sha8 = it.sha8;
    cell.dataset.aiPred = it.ai_pred || "";
    cell.title = it.sha8 + (it.box_time ? " " + it.box_time : "");  // sha8/日時はtitle属性へ（2026-09-15 密な見直し）

    var shot = document.createElement("div");
    shot.className = "shot";
    var img = document.createElement("img");
    img.src = it.img; img.loading = "lazy"; img.alt = "認証文字 " + it.sha8;
    var tag = document.createElement("span");
    tag.className = "boxtag"; tag.hidden = true;  // 表示可否とラベルは layout() が毎回設定する
    var conf = document.createElement("span");
    conf.className = "conf"; conf.textContent = Math.round((it.ai_conf || 0) * 100) + "%";
    shot.appendChild(img); shot.appendChild(tag); shot.appendChild(conf);

    var ansWrap = document.createElement("div");
    ansWrap.className = "ansWrap";
    var inp = document.createElement("input");
    inp.className = "ans"; inp.type = "text"; inp.inputMode = "numeric";
    inp.autocomplete = "off";
    // maxLength は付けない（④未決: 「20-41 81」の貼り付けがブラウザに先に6文字へ切られ「2041」になる不具合の
    // 原因だった）。桁数の切り詰めは beforeinput ハンドラが正規化してから行う。
    inp.placeholder = "6桁";
    var digits = document.createElement("div");
    digits.className = "digits"; digits.setAttribute("aria-hidden", "true");
    ansWrap.appendChild(inp); ansWrap.appendChild(digits);

    var ctrlrow = document.createElement("div");
    ctrlrow.className = "ctrlrow";
    var skip = document.createElement("button");
    skip.type = "button"; skip.className = "skip"; skip.textContent = "読めない";
    var revert = document.createElement("button");
    revert.type = "button"; revert.className = "revert"; revert.textContent = "AIに戻す";
    revert.title = "AIの予測に戻す";
    var picked = document.createElement("span");
    picked.className = "picked";
    ctrlrow.appendChild(skip); ctrlrow.appendChild(revert); ctrlrow.appendChild(picked);

    cell.appendChild(shot); cell.appendChild(ansWrap); cell.appendChild(ctrlrow);

    var s = st(it.sha8);
    if (s.gone) {
      applyGoneUi(cell, it);
    } else {
      // 保存済み回答があればそれ／無ければAI予測／それも無ければ空、の優先順（2026-09-15 pia-queue-prefill-ai-pred）。
      // AI予測で埋めた場合は reviewed も立てる＝拓也が触らないまま送信してもAI予測が回答として登録される。
      if (!s.answer && !s.unreadable && it.ai_pred) {
        s.answer = it.ai_pred; s.reviewed = true; s.aiFilled = true;
      }
      inp.value = s.answer || "";
      paint(cell, s);
    }
    syncDigits(cell, inp.value);
    updatePicked(cell, it.sha8);

    if (!it.ai_pred) revert.hidden = true;  // ④未決: AI予測が無い札で「AIに戻す」を押すとundefinedが入っていた
    revert.addEventListener("click", function(){
      if (!it.ai_pred) return;
      inp.value = it.ai_pred; inp._retypeSession = true; inp.dispatchEvent(new Event("input"));
      inp.focus({preventScroll:true});
    });
    inp.addEventListener("focus", function(){ inp.select(); inp._retypeSession = true; });
    // キーボードで選択を動かしたとき（Shift+←→・Home/End・Ctrl+A）も「全部打ち直すか」を選択範囲から
    // 決め直す（2026-09-16 pia-queue-align-cont3-polish: 全選択で入って Shift+← で1桁だけ選び直して打つと、
    // フォーカス時の true が残ったまま次の札へ飛んでいた＝桁クリックで直した誤操作がキーボード経路に残っていた）。
    // keydown の時点では選択はまだ動いていないので印だけ付け、動いた後の keyup か次の打鍵の beforeinput の
    // 早いほうで読む（setTimeout で読むと、間を置かずに打った打鍵がタイマーより先に処理されて間に合わない）。
    inp.addEventListener("keydown", function(e){
      var selectAll = (e.ctrlKey || e.metaKey) && (e.key === "a" || e.key === "A");
      if (NAV_KEYS[e.key] || selectAll) inp._selMoved = true;
    });
    inp.addEventListener("keyup", function(){
      if (inp._selMoved) { inp._selMoved = false; inp._retypeSession = selectionCoversAll(inp); }
    });
    // 入力欄のドラッグ＆ドロップを止める（2026-09-16 pia-queue-align-cont3-polish）: 選んだ桁の上からドラッグを
    // 始めるとブラウザ既定の「選択文字の移動」になり、桁の順番が黙って入れ替わった（204381→204831）。別の札の
    // 欄へ落とすとその札の答えを丸ごと移していた（元の札は空・移った先は人の回答として送られる）。ドラッグは
    // 「押した桁から離した桁までを選ぶ」（snapSelection）だけにする。
    inp.addEventListener("dragstart", function(e){ e.preventDefault(); });
    inp.addEventListener("drop", function(e){ e.preventDefault(); });
    // beforeinput: 全角→半角変換・区切り入り貼り付けの正規化・満杯の欄でキャレット位置に打つと
    // 次の桁を上書きする（追加して切り詰めるのではない）。変換中(IME)はそのまま表示させ、
    // compositionend で正規化する＝変換中に replace(/[^0-9]/g,"") が全角数字を消していた不具合の直し。
    inp.addEventListener("beforeinput", function(e){
      // キーボードで選択を動かした直後の打鍵＝ここで「全部打ち直すか」を決める（上の keydown/keyup 参照）
      if (inp._selMoved) { inp._selMoved = false; inp._retypeSession = selectionCoversAll(inp); }
      if (e.isComposing) return;
      var data = e.data;
      if (data == null) return;  // 削除系(inputType=delete*)等は素通りさせ、input側の正規化に任せる
      var digits = toHalfWidthDigits(data).replace(/[^0-9]/g, "");
      if (!digits) return;
      var old = inp.value;
      var start = inp.selectionStart, end = inp.selectionEnd;
      var before = old.slice(0, start);
      var after = old.slice(end);
      if (old.length >= 6) {
        // 満杯の欄で打つ・貼る＝選んでいた桁数より多いぶんは続きの桁を上書きする（押し出された末尾が
        // 切り詰められて黙って消えるのを防ぐ）。キャレットだけなら打った桁数ぶん上書き。1桁を選んで2桁を
        // 貼ったら1桁ぶん上書き（2026-09-16 pia-queue-align-cont3-polish: 204381 の2桁目を選んで「77」を
        // 貼ると 277438 になり、末尾の1が消えていた）
        after = after.slice(Math.min(after.length, Math.max(0, digits.length - (end - start))));
      }
      e.preventDefault();
      inp.value = (before + digits + after).slice(0, 6);
      var caret = Math.min(before.length + digits.length, inp.value.length);
      inp.setSelectionRange(caret, caret);
      inp.dispatchEvent(new Event("input"));
    });
    inp.addEventListener("compositionend", function(){
      // 日本語入力確定時に全角数字を半角へ正規化する（変換中は書き換えない＝表示が乱れるため）
      var digits = toHalfWidthDigits(inp.value).replace(/[^0-9]/g, "").slice(0, 6);
      if (digits !== inp.value) inp.value = digits;
      inp.dispatchEvent(new Event("input"));
    });
    inp.addEventListener("input", function(e){
      if (e.isComposing) return;  // 変換中の正規化は compositionend に任せる
      var v = inp.value.replace(/[^0-9]/g, "").slice(0, 6);
      if (v !== inp.value) inp.value = v;
      var s2 = st(it.sha8);
      delete s2.aiFilled;  // 人が編集した＝AI予測のまま扱いを外す
      if (s2.sent) delete s2.sent;  // 送信済みを直したら送信対象に戻す（見返して直せる、の帰結。放置すると直した値が二度と送られない）
      s2.answer = v; s2.unreadable = false;
      s2.reviewed = v.length === 6;
      paint(cell, s2); syncDigits(cell, v); updatePicked(cell, it.sha8); tally(); persist();
      // 自動で次の札へ移るのは「全部打ち直したとき」（入力を始めた時点で全選択か空だった＝
      // inp._retypeSession）だけにする。桁クリックで1桁だけ直したときは、その桁で次の札を
      // 上書きしてしまわないようその札に留まる＝Enterで確定して次へ進む（親から09-16指摘）。
      if (v.length === 6 && inp._retypeSession) focusNext(inp);
    });
    inp.addEventListener("keydown", function(e){
      if (e.key !== "Enter") return;
      e.preventDefault();
      var inputs = visibleInputs();
      var i = inputs.indexOf(inp);
      if (e.shiftKey) { if (i > 0) { inputs[i-1].focus(); inputs[i-1].select(); } return; }
      if (inp.value.length !== 6) return;
      // Enter＝「この6桁で合っている」と人が確かめた合図。AI予測のまま流しても確認済みにする
      // （旧版は次へ移るだけで ai のまま残り、確かめた札とまだ見ていない札が見分けられなかった・2026-09-15）
      var s2 = st(it.sha8);
      if (s2.aiFilled) { delete s2.aiFilled; s2.reviewed = true; paint(cell, s2); tally(); persist(); }
      if (i >= 0 && i + 1 < inputs.length) { inputs[i+1].focus(); inputs[i+1].select(); }
    });
    skip.addEventListener("click", function(){
      var s2 = st(it.sha8);
      if (s2.sent) delete s2.sent;  // 送信済みを直したら送信対象に戻す（inpと同じ理由）
      s2.unreadable = !s2.unreadable;
      if (s2.unreadable) {
        // 押す前の値と状態を退避＝押し間違えてもう一度押して戻したとき復元する（④未決）
        s2.beforeSkip = {answer: s2.answer || "", aiFilled: !!s2.aiFilled};
        delete s2.aiFilled;
        s2.answer = ""; s2.reviewed = true; inp.value = "";
      } else {
        var prev = s2.beforeSkip || {answer: "", aiFilled: false};
        delete s2.beforeSkip;
        s2.answer = prev.answer; inp.value = prev.answer;
        if (prev.aiFilled) { s2.aiFilled = true; s2.reviewed = true; }
        else { delete s2.aiFilled; s2.reviewed = prev.answer.length === 6; }
      }
      paint(cell, s2); syncDigits(cell, inp.value); updatePicked(cell, it.sha8); tally(); persist();
    });

    return cell;
  }

  function paint(cell, s){
    cell.dataset.state = s.unreadable ? "skip" : (s.aiFilled ? "ai" : (s.reviewed ? "ok" : "todo"));
    var inp = cell.querySelector("input.ans");
    if (inp) inp.disabled = false;
  }

  // 「回答を選んだか」の小さな付記（2026-09-15 pia-queue-page-answered-badge）。未回答は空文字。
  // 「＝AI」は aiFilled（未確認のプリフィル）でなく、値がAI予測と一致するかで出す
  // （人がEnter確定等でaiFilledが外れても、AI予測どおりに送った事実は変わらないため）。
  function pickedText(s, it){
    if (!s || !s.reviewed) return "";
    var isAiMatch = !!(it && it.ai_pred && s.answer === it.ai_pred);
    var base = s.unreadable ? "読めない" : (s.answer || "") + (isAiMatch ? " ＝AI" : "");
    var text = "✔ " + base;
    if (s.sent) text += "・送信済";
    return text;
  }
  function updatePicked(cell, sha8){
    var el = cell.querySelector(".picked");
    if (el) el.textContent = pickedText(state[sha8], itemBySha[sha8]);
  }

  function applyGoneUi(cell, it){
    cell.dataset.state = "gone";
    var inp = cell.querySelector("input.ans");
    if (inp) { inp.disabled = true; inp.value = state[it.sha8].answer || ""; syncDigits(cell, inp.value); }
    var skipBtn = cell.querySelector("button.skip");
    if (skipBtn) skipBtn.disabled = true;
    if (!cell.querySelector(".gone-note")) {
      var note = document.createElement("div");
      note.className = "gone-note"; note.textContent = "他の人が回答済みです";
      cell.appendChild(note);
    }
  }

  function visibleInputs(){
    // 送信済みで畳んだ札の欄（display:none）は除く＝そこへ focus しても何も起きず Enter が足止めされる
    return Array.prototype.slice.call(main.querySelectorAll('.cell:not([data-state="gone"]) input.ans'))
      .filter(function(inp){ return inp.getClientRects().length > 0; });
  }
  function focusNext(fromInput){
    var inputs = visibleInputs();
    var i = inputs.indexOf(fromInput);
    if (i >= 0 && i + 1 < inputs.length) { inputs[i+1].focus(); inputs[i+1].select(); }
  }

  // ---------- クリック/ドラッグを「表示の桁」に合わせる（2026-09-15 pia-queue-align-bottom-actions） ----------
  // letter-spacing は字の右側にだけ付くので、ブラウザ既定の当たり判定（字の箱＝字+字間の中点）は見た目の
  // 字の中心から半字間ぶん右へずれる（字のすぐ右を押すとキャレットがその字の左に入る）。クリックは
  // 「指した桁を選ぶ」、ドラッグは「押した桁から離した桁まで」に置き直す＝そのまま数字を打てば指した桁が
  // 置き換わる。位置の出所は .digits（表示そのもの）＝見えている桁と当たり判定が同じ物から導かれる。
  function digitSlots(cell){
    var spans = cell.querySelectorAll(".digits span");
    var slots = [];
    for (var i = 0; i < spans.length; i++) {
      if (!spans[i].textContent) break;
      var r = spans[i].getBoundingClientRect();
      if (!r.width) break;
      var gap = parseFloat(getComputedStyle(spans[i]).letterSpacing) || 0;
      slots.push({center: r.left + (r.width - gap) / 2, pitch: r.width});
    }
    return slots;
  }
  function slotAt(slots, clientX){
    var best = -1, bestDist = Infinity;
    for (var i = 0; i < slots.length; i++) {
      var d = Math.abs(clientX - slots[i].center);
      if (d < bestDist) { bestDist = d; best = i; }
    }
    if (best < 0) return {index: -1, inside: false, right: false};
    return {index: best, inside: bestDist <= slots[best].pitch / 2, right: clientX > slots[best].center};
  }
  function snapSelection(inp, x0, x1, shiftAnchor){
    var cell = inp.closest(".cell");
    if (!cell) return;
    var slots = digitSlots(cell);
    if (!slots.length || !inp.value.length) return;
    var a = slotAt(slots, x0);
    if (a.index < 0) return;
    if (Math.abs(x1 - x0) < 4) {
      // クリック: 字の無い右側の余白を押したときだけ末尾へキャレット（続きを打てる）
      if (!a.inside && a.right && slots.length < 6) { inp.setSelectionRange(slots.length, slots.length); return; }
      if (shiftAnchor) {
        // Shift+クリック: 既存の選択の端から、クリックした桁までを1つの範囲にまとめる
        // （land前critic指摘・中: 素のinputと同じ「アンカーからクリック位置まで」の拡張）
        var lo2 = Math.min(shiftAnchor.start, a.index), hi2 = Math.max(shiftAnchor.end, a.index + 1);
        inp.setSelectionRange(lo2, hi2);
        return;
      }
      inp.setSelectionRange(a.index, a.index + 1);
      return;
    }
    var b = slotAt(slots, x1);
    var lo = Math.min(a.index, b.index), hi = Math.max(a.index, b.index);
    inp.setSelectionRange(lo, hi + 1, x1 < x0 ? "backward" : "forward");
  }
  // 選択の目印（2026-09-16 pia-queue-align-cont3-polish で一本化）: 入力欄自身の選択帯は CSS で消し、
  // 目印は .digits の span.sel だけが描く。したがって目印は「フォーカス中の入力欄の選択範囲」と常に
  // 一致していなければならない。selectionchange はクリック・ドラッグ・キーボードの選択変更をまとめて
  // 拾えるが、それだけに頼ると取りこぼす環境（スマホの日本語入力など）があるので keyup・mouseup・
  // input・select・focusin/focusout でも同じ関数で同期する。フォーカスが外れたら消す（Tab で
  // 「読めない」へ移ったときに目印だけ残っていた＝cont2 の land前critic 軽微）。
  function syncSelectionMark(){
    var el = document.activeElement;
    var inp = (el && el.matches && el.matches("input.ans") && main.contains(el) && !el.disabled) ? el : null;
    var cell = inp ? inp.closest(".cell") : null;
    var prev = main.querySelectorAll(".digits span.sel");
    for (var i = 0; i < prev.length; i++) prev[i].classList.remove("sel");
    if (!cell) return;
    var s = inp.selectionStart, e = inp.selectionEnd;  // s === e（キャレットだけ）なら目印は出さない
    var spans = cell.querySelectorAll(".digits span");
    for (var j = s; j < e && j < spans.length; j++) spans[j].classList.add("sel");
  }
  document.addEventListener("selectionchange", syncSelectionMark);
  ["keyup", "input", "select", "focusin", "mouseup", "touchend"].forEach(function(type){
    main.addEventListener(type, syncSelectionMark);
  });
  // focusout の最中は activeElement がまだ移り切っていない＝移った後に読む
  main.addEventListener("focusout", function(){ setTimeout(syncSelectionMark, 0); });

  var digitPress = null;
  // land前critic指摘・中: mousedownをmainだけで聞いていると、mouseupが来ない経路
  // （ドラッグ選択を外へ持ち出す・ウィンドウ外で離す等）でdigitPressが残り、次にmain外
  // （ヘッダー等）を普通にクリックしたときの古いmouseupがそれを拾って無関係な選択を書き換える。
  // documentで聞いて、入力欄以外へのmousedownでも確実にdigitPressを捨てる。
  document.addEventListener("mousedown", function(e){
    var inp = (e.target && e.target.closest) ? e.target.closest("input.ans") : null;
    if (!inp) { digitPress = null; return; }
    // ダブルクリック（detail>=2）はdblclickハンドラ側で明示的に全選択する（snapが直前に置いた
    // 一部選択のせいでブラウザ既定の語選択が発動しないことがある＝land前critic指摘・重大）。
    digitPress = (e.detail < 2 && e.button === 0 && !inp.disabled)
      ? {inp: inp, x: e.clientX, shift: e.shiftKey,
         anchorStart: inp.selectionStart, anchorEnd: inp.selectionEnd}
      : null;
  });
  // ダブルクリックの1回目のクリックが仕掛けた遅延snap（下のmouseup→setTimeout）が、dblclick
  // ハンドラのinp.select()より後に発火すると全選択を上書きしてしまう（1回目のmousedown/mouseup
  // が先に走り、2回目の一連が終わってからイベントループへ戻ったときにまとめて発火する経路が
  // 実測で存在した）。世代カウンタで「その間にダブルクリックが起きた遅延snap」を無効化する。
  var selectionGen = 0;
  main.addEventListener("dblclick", function(e){
    var inp = (e.target && e.target.closest) ? e.target.closest("input.ans") : null;
    if (!inp) return;
    selectionGen++;
    inp.select();  // 既定の語選択に頼らず明示的に全選択（land前critic指摘・重大の直し）
    inp._retypeSession = true;
  });
  document.addEventListener("mouseup", function(e){
    var p = digitPress; digitPress = null;
    if (!p) return;
    var x1 = e.clientX;
    var gen = selectionGen;
    // 既定の当たり判定（クリック位置へのキャレット設定）が終わってから置き直す
    setTimeout(function(){
      if (gen !== selectionGen) return;  // 待っている間にダブルクリックが全選択で確定させた
      if (document.activeElement !== p.inp) return;
      snapSelection(p.inp, p.x, x1, p.shift ? {start: p.anchorStart, end: p.anchorEnd} : null);
      // 結果の選択範囲が「全6桁」か「空」でなければ一部だけ直す意図＝自動で次の札へ進む対象から外す。
      // クリック直後のfocusハンドラがいったんtrueに戻すため、ここ（snap確定後）で最後に決める。
      p.inp._retypeSession = selectionCoversAll(p.inp);
      syncSelectionMark();  // snap で置き直した範囲に目印を合わせる（selectionchange の到着を待たない）
    }, 0);
  });

  // 「この画面」＝ヘッダーの下端から送信バーの上端までの帯（2026-09-15 pia-queue-align-bottom-actions）。
  // 帯にそのカードの画像と読みの行（.shot と .ansWrap）が両方とも完全に入っているカードだけを対象にする。
  // 旧版はウィンドウ下端までを可視としていたため、送信バーの下に隠れた札まで「見えている」と数えていた
  // （ボタンを下へ移すとバーが高くなり悪化する不具合・司令塔がコードを読んで特定）。
  // land前critic指摘・重大: 当初は1pxでも重なれば可視としていたため、下端で切れて画像が見えていない
  // 札まで確定・送信されていた（cellの外枠でなく.shot/.ansWrapを見る現行版でも同じ厳密さを保つ）。
  function isCardVisible(cell){
    var headerEl = document.querySelector("header");
    var hb = headerEl ? headerEl.getBoundingClientRect().bottom : 0;
    var bottom = sendbar.getBoundingClientRect().top;
    var shot = cell.querySelector(".shot");
    var ansWrap = cell.querySelector(".ansWrap");
    if (!shot || !ansWrap) return false;
    var rs = shot.getBoundingClientRect();
    var ra = ansWrap.getBoundingClientRect();
    return rs.top >= hb && rs.bottom <= bottom && ra.top >= hb && ra.bottom <= bottom;
  }

  // ---------- queue.json との突き合わせ（reconcile） ----------
  function reconcile(data){
    var keep = captureFocus();
    var seen = {};
    (data.items || []).forEach(function(it){
      seen[it.sha8] = true;
      itemBySha[it.sha8] = it;
      if (!cells[it.sha8]) cells[it.sha8] = buildCell(it);
    });

    // queue.jsonから消えた項目
    Object.keys(cells).forEach(function(sha8){
      if (seen[sha8]) return;
      var s = st(sha8);
      if (s.sent || !s.reviewed || s.aiFilled) {
        // 自分が送って取り込まれた・もともと未入力・AI予測のまま人が未確認＝黙って消す
        // （aiFilledは他人の回答と見た目が区別できない=「他の人が回答済み」の幽霊カードに
        // してはいけない・2026-09-15 land前critic指摘）
        var cell = cells[sha8];
        if (cell && cell.parentNode) cell.parentNode.removeChild(cell);
        delete cells[sha8];
        delete state[sha8];
      } else if (!s.gone) {
        s.gone = true;
        applyGoneUi(cells[sha8], itemBySha[sha8] || {sha8: sha8});
      }
    });

    // ★land前critic指摘・中の回帰: 上のループは`cells`（今セッションで実際に描画した項目）
    // だけを見る。localStorageに残った`state`は前回セッションの入力を引き継ぐため、
    // 「入力したが送らずタブを閉じ、その間に他の人が答えてqueue.jsonから消えた」項目は
    // 今セッションでは一度もcellが作られず、この孤児stateが`collectPending`に残り続けて
    // 画面に出さないまま送信され得た。cellが無く・今回のqueue.jsonにも無い（=表示する
    // すべを持たない）stateは安全側に倒して削除する。
    Object.keys(state).forEach(function(sha8){
      if (seen[sha8] || cells[sha8]) return;
      delete state[sha8];
    });
    persist();

    layout();  // 並び替え（既定=確信度が低い順）はDOMを作り直さず既存カードを動かすだけ

    tally();

  }

  // 60秒ごとの reconcile で入力中の札が並べ直しに巻き込まれても、フォーカスとカーソル位置を戻す
  // （2026-09-15 拓也「数十秒で入力欄から外れてマウスで戻すのがだるい」）。動かす札は arrangeChildren が
  // 最小にするので、ここは入力中の札そのものが動いた回（確信度の更新で順位が入れ替わった等）の保険。
  function captureFocus(){
    var el = document.activeElement;
    if (!el || !el.matches || !el.matches("input.ans") || !main.contains(el)) return null;
    return {el: el, start: el.selectionStart, end: el.selectionEnd};
  }
  function restoreFocus(keep){
    if (!keep || document.activeElement === keep.el || keep.el.disabled || !main.contains(keep.el)) return;
    keep.el.focus({preventScroll: true});  // focus ハンドラが全選択する→直後に元の範囲へ戻す
    try { keep.el.setSelectionRange(keep.start, keep.end); } catch (e) {}
  }

  function boxHeadingHtml(boxTime, remaining){
    return (boxTime || "") + " <span class=\"rest\">残り " + remaining + " 件</span>";
  }

  // ---------- 並び替え（3択: 確信度が低い順(既定)/高い順/最新の箱順） ----------
  // `measure/box_ingest.py`の`sort_items`と同じ規約（欠損は向きに関わらず最後、
  // タイブレークは「箱が新しい順→sha8順」）をJS側でも保つ。
  function compareItems(a, b, mode){
    if (mode === "box") return tieBreak(a, b);
    var ca = (typeof a.ai_conf === "number") ? a.ai_conf : null;
    var cb = (typeof b.ai_conf === "number") ? b.ai_conf : null;
    if (ca === null && cb === null) return tieBreak(a, b);
    if (ca === null) return 1;
    if (cb === null) return -1;
    if (ca === cb) return tieBreak(a, b);
    var diff = ca - cb;
    return mode === "conf_desc" ? -diff : diff;
  }
  function tieBreak(a, b){
    var bta = a.box_time || "", btb = b.box_time || "";
    if (bta !== btb) return bta < btb ? 1 : -1;  // 箱が新しい順
    var sa = a.sha8 || "", sb = b.sha8 || "";
    return sa < sb ? -1 : (sa > sb ? 1 : 0);      // sha8順
  }
  function sortedShas(mode){
    var shas = Object.keys(cells);
    shas.sort(function(shaA, shaB){
      var a = itemBySha[shaA] || {sha8: shaA};
      var b = itemBySha[shaB] || {sha8: shaB};
      return compareItems(a, b, mode);
    });
    return shas;
  }
  function boxLabel(it){
    return (it && it.box_time) ? it.box_time.slice(5) : "";  // 先頭の年を削って短く（MM-DD HH:MM:SS）
  }

  // parent の子を order の並びに揃える。既に正しい位置にあるノードは動かさない（appendChild で全部
  // 並べ直すと、入力中の欄を含む札も一瞬DOMから外れてフォーカスが落ちる）。
  function arrangeChildren(parent, order){
    var prev = null;
    order.forEach(function(node){
      var want = prev ? prev.nextSibling : parent.firstChild;
      if (want !== node) parent.insertBefore(node, want);
      prev = node;
    });
  }

  function layout(){
    var shas = sortedShas(currentMode);
    var showTag = currentMode !== "box";  // 箱順のときは従来の見出しでまとまるのでタグは要らない

    shas.forEach(function(sha8){
      var tag = cells[sha8].querySelector(".boxtag");
      if (!tag) return;
      tag.hidden = !showTag;
      tag.textContent = showTag ? boxLabel(itemBySha[sha8]) : "";

    if (currentMode === "box") renderGrouped(shas); else renderFlat(shas);
  }

  function renderFlat(shas){
    Object.keys(boxSections).forEach(function(boxId){
      boxSections[boxId].remove(); delete boxSections[boxId];
    });
    if (!flatList) {

      flatList.className = "cells";

  function renderGrouped(shas){
    if (flatList && flatList.parentNode) flatList.remove();

      var it = itemBySha[sha8];

    var secOrder = [];

      var sec = boxSections[boxId];

        sec.className = "box";
        sec.dataset.boxId = boxId;
        var h2 = document.createElement("h2");
        var list = document.createElement("div");
        list.className = "cells";
        sec.appendChild(h2); sec.appendChild(list);
        boxSections[boxId] = sec;
      }
      secOrder.push(sec);
      var list = sec.querySelector(".cells");
      var firstItem = null;
      byBox[boxId].forEach(function(sha8){
        if (!firstItem) firstItem = itemBySha[sha8];
      });
      arrangeChildren(list, byBox[boxId].map(function(sha8){ return cells[sha8]; }));
      var remaining = byBox[boxId].filter(function(sha8){
        return !cellIsHandled(state[sha8]);
      }).length;
      sec.querySelector("h2").innerHTML =

    });

    arrangeChildren(main, secOrder);  // boxOrder(新しい順)どおりに並べる

    Object.keys(boxSections).forEach(function(boxId){

      }
    });
  }

  function applySortButtons(){
    Array.prototype.forEach.call(sortbar.querySelectorAll(".sortopt"), function(btn){

    });
  }
  sortbar.addEventListener("click", function(e){
    var btn = e.target.closest(".sortopt");

    layout();
  });
  applySortButtons();

  function tally(){
    var n = 0;
    var shas = Object.keys(cells);

  }

  // 「未確認の先頭へ」: 並び順で最初の未確認札（AI予測のまま・未入力）の入力欄へ移る＝見返しに上へ
  // 戻った後でも、続きの位置へキーボードの手を戻せる
  jumpTodo.addEventListener("click", function(){
    var inputs = visibleInputs();
    for (var i = 0; i < inputs.length; i++) {
      if (cellIsHandled(state[inputs[i].closest(".cell").dataset.sha8])) continue;
      inputs[i].scrollIntoView({block: "center"});
      inputs[i].focus({preventScroll: true}); inputs[i].select();

    }

  // 送信バーの状態表示は1行だけ（2026-09-16 pia-queue-align-cont3-polish: 旧版は送信結果を #actionStatus と
  // #sendStatus の両方に書き、「届きました（N件）」が2行並んでいた）。一括確認・取り消し・送信の結果は最後の
  // 1件だけをここに出す。「送信中…」は送るボタン自身が、送れなかった分は退避パネル（本文と LINE への案内）が
  // 知らせるので、ここには書かない（同じことを2か所で言わない）。
  function setStatus(text){
    actionStatus.textContent = text;
    actionStatus.hidden = !text;

  }

  // ---------- 画面ごとの一括確認（2026-09-15「この画面の残りは全部合ってる」） ----------
  // いま画面に見えているAI予測のまま未確認のカードだけをまとめて確定（human）にする。
  // 直前の一括確認だけ1回取り消せる（新しい一括確認を押すと取り消し権は上書きされる）。
  // lastBulk は {sha8, answer} のスナップショット（②誤操作の穴: 一括確認の後に手で直した札を
  // 取り消しの対象から外すため。sha8だけの配列だと「確定時と今で値が同じか」を判定できなかった）。
  var lastBulk = null;
  function bulkTargets(){
    var targets = [];
    Object.keys(cells).forEach(function(sha8){
      var cell = cells[sha8];
      if (cell.dataset.state !== "ai") return;  // 未確認(AI予測のまま)だけが対象
      var s = state[sha8];
      if (!s || s.sent || s.gone) return;
      if (!isCardVisible(cell)) return;  // 見えていないカードは確定しない
      targets.push(sha8);
    });
    return targets;
  }
  function setBulkPreview(on){
    var targets = on ? bulkTargets() : [];
    Object.keys(cells).forEach(function(sha8){

  }
  var bulkPreviewActive = false;  // ボタンにマウスを乗せている/フォーカス中か

  bulkConfirmBtn.addEventListener("focus", function(){ bulkPreviewActive = true; setBulkPreview(true); });
  bulkConfirmBtn.addEventListener("blur", function(){ bulkPreviewActive = false; setBulkPreview(false); });
  bulkConfirmBtn.addEventListener("click", function(){

    targets.forEach(function(sha8){
      var s2 = st(sha8);
      delete s2.aiFilled;
      s2.reviewed = true;
      paint(cells[sha8], s2);
      updatePicked(cells[sha8], sha8);
    });

    setBulkPreview(false);
    setStatus(snapshot.length + "件を確定しました");

  });
  // 取り消しで実際に戻る札（2026-09-16 pia-queue-align-cont3-polish: 件数は実数で出す。旧版は一括確認の件数を
  // 出したままで、手直しして対象から外れた札まで「取り消す／取り消しました（N件）」に数えていた）。一括確認の
  // 後に手で直した札・「読めない」にした札・送った札・他の人が回答済みになった札は戻らない＝数えない。
  function undoableBulk(){
    if (!lastBulk) return [];
    return lastBulk.filter(function(entry){

    });
  }
  function updateBulkUndo(){
    var n = undoableBulk().length;
    bulkUndoBtn.hidden = !n;  // 戻る札が無くなったら出さない（押しても何も起きないボタンを残さない）
    bulkUndoBtn.textContent = "取り消す（" + n + "件）";
  }
  bulkUndoBtn.addEventListener("click", function(){
    if (!lastBulk) return;
    var targets = undoableBulk();
    targets.forEach(function(entry){
      var s2 = state[entry.sha8];
      s2.aiFilled = true;
      var cell = cells[entry.sha8];
      if (cell) { paint(cell, s2); updatePicked(cell, entry.sha8); }
    });

    setStatus("取り消しました（" + targets.length + "件）");

  });

  // ---------- fetch ----------
  function loadQueue(){
    fetch("queue.json?t=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(reconcile)
      .catch(function(){ /* 一時的な取得失敗は次の60秒で回復する */ });
  }
  loadQueue();
  setInterval(loadQueue, POLL_MS);

  // ---------- 回答を送る（受け口へ fetch POST・200 と ok を受けて初めて sent にする） ----------
  // 2026-09-14 pia-answers-no-login-inbox: 旧版は GitHub の Issue 作成画面を開いた直後に sent を
  // 固定していた（届いたかを見ていない＋GitHub ログインが要る＝GitHub を持たない友達の回答が
  // 1件も届かなかった）。受け口（Cloud Run・認証なし）に text/plain で POST し、返答の ok を
  // 受けてから sent にする。失敗したら本文を画面に出して LINE で送れる退避を用意する。
  function readName(){
    var v = "";
    try { v = localStorage.getItem(LS_NAME) || ""; } catch (e) {}
    return v.replace(/[\r\n\t]/g, " ").trim().slice(0, NAME_MAX_LEN);
  }
  function saveName(v){
    try { localStorage.setItem(LS_NAME, v.replace(/[\r\n\t]/g, " ").trim().slice(0, NAME_MAX_LEN)); } catch (e) {}
  }
  function buildBody(pairs){
    var lines = ["queue"];
    var name = readName();
    if (name) lines.push("name: " + name);
    // 第3要素は source（`human`=人が確認/修正・`ai_unconfirmed`=AI予測のまま未確認で送信・
    // 2026-09-15 pia-answer-source-ai-vs-human）。`box_ingest.ANSWER_LINE_RE`の任意第3群と同じ規約。
    pairs.forEach(function(p){ lines.push(p[0] + " " + p[1] + " " + p[2]); });
    return lines.join("\n");
  }
  function splitBodies(pairs){
    if (!pairs.length) return [];
    var full = buildBody(pairs);
    if (full.length <= INBOX_BODY_MAX_LEN || pairs.length <= INBOX_CHUNK_SIZE) return [pairs];
    var chunks = [];
    for (var i = 0; i < pairs.length; i += INBOX_CHUNK_SIZE) chunks.push(pairs.slice(i, i + INBOX_CHUNK_SIZE));
    return chunks;
  }
  function collectPending(){
    var pairs = [];
    Object.keys(state).forEach(function(sha8){
      var s = state[sha8];
      if (s.reviewed && !s.sent && !s.gone) {
        pairs.push([sha8, s.unreadable ? "?" : s.answer, s.aiFilled ? "ai_unconfirmed" : "human"]);
      }
    });
    return pairs;
  }
  // 途中送信（2026-09-15）: 人が触った（直した・確定した・「読めない」）カードだけを対象にする。
  // AI予測のまま未確認のカードは含めない＝画面上部の「ここまで送る」専用の集合。
  function collectTouchedPending(){
    var pairs = [];
    Object.keys(state).forEach(function(sha8){
      var s = state[sha8];
      if (s.reviewed && !s.aiFilled && !s.sent && !s.gone) {
        pairs.push([sha8, s.unreadable ? "?" : s.answer, "human"]);
      }
    });
    return pairs;
  }
  function countSentWaiting(){
    var n = 0;

      if (s.sent && !s.gone) n++;
    });
    return n;
  }
  function markSent(chunk){
    chunk.forEach(function(p){

      var s = state[sha8];

      var curAnswer = s.unreadable ? "?" : s.answer;
      var curSource = s.aiFilled ? "ai_unconfirmed" : "human";
      // ④未決: 送信中(fetch往復中)に編集・一括確認した札は、送った値・sourceと今のstateが
      // 一致するときだけsentにする。ずれていたら直した値が二度と送られないので、送信対象に残す。
      if (curAnswer !== sentAnswer || curSource !== sentSource) return;

      var cell = cells[sha8];
      if (cell) updatePicked(cell, sha8);
      // land前critic指摘・中: 送信済みの札が直前の一括確認の対象に残っていると、取り消しが
      // 「取り消せた」と表示しつつ実際は何も戻らず（サーバのhumanは残る・sentも残る）、
      // かつaiFilledだけ復活して未確認カウントに二度と減らないゾンビ状態になっていた。
      if (lastBulk) {

  function unsendAll(){

    // sent かつ gone でない項目の sent を外して送信対象に戻す（state の形は変えない）。
    Object.keys(state).forEach(function(sha8){
      var s = state[sha8];
      if (!(s.sent && !s.gone)) return;

      if (cell) updatePicked(cell, sha8);

  function postBody(body){
    return fetch(ANSWERS_INBOX_URL, {

      body: body
    }).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(j){
      if (!j || j.ok !== true) throw new Error("bad response");

    });

  var sending = false;
  var failedBodies = [];    // 送れなかった本文（退避パネルに出す）

    function next(){

  sendTop.addEventListener("click", sendTouched);

  function copyText(text, btn){
    var done = function(){ btn.textContent = "コピーしました"; setTimeout(function(){ btn.textContent = "コピー"; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {

    document.body.appendChild(ta); ta.select();

  // 送信バーの中身は1回だけ作って使い回す（2026-09-15 の名前欄と同じ理由:
  // ④未決 renderSendbar() は毎回ボタンを作り直していたため、Tab でフォーカスした「回答を送る」が
  // 60秒ごとの reconcile で外れていた。ここから先は文言と disabled/hidden だけを更新する。
  var nameInp = document.createElement("input");
  nameInp.className = "name"; nameInp.type = "text"; nameInp.placeholder = "名前（任意）";
  nameInp.maxLength = NAME_MAX_LEN; nameInp.value = readName(); nameInp.autocomplete = "off";

  sendCtl.style.display = "contents";
  sendbar.appendChild(sendCtl);

  var sendBtn = document.createElement("button");
  sendBtn.type = "button"; sendBtn.className = "send";
  sendBtn.addEventListener("click", sendAll);
  sendCtl.appendChild(sendBtn);

  var resendBtn = document.createElement("button");
  resendBtn.type = "button"; resendBtn.className = "resendall"; resendBtn.hidden = true;
  resendBtn.title = "届いていない回答を送信対象に戻す。押した後に「回答を送る」を押す";
  resendBtn.addEventListener("click", unsendAll);
  sendCtl.appendChild(resendBtn);

  var fallbackEl = document.createElement("div");
  fallbackEl.className = "fallback"; fallbackEl.id = "sendFallback"; fallbackEl.hidden = true;
  var fbP = document.createElement("p");
  fbP.textContent = "送れませんでした。下の本文をコピーして、このまま LINE で拓也に送ってね";
  var fbTa = document.createElement("textarea");
  fbTa.readOnly = true;
  var fbCp = document.createElement("button");
  fbCp.type = "button"; fbCp.textContent = "コピー";
  fbCp.addEventListener("click", function(){ copyText(fbTa.value, fbCp); });
  fallbackEl.appendChild(fbP); fallbackEl.appendChild(fbTa); fallbackEl.appendChild(fbCp);
  sendCtl.appendChild(fallbackEl);

  function updateSendTop(){
    var touched = collectTouchedPending();
    sendTopN.textContent = touched.length;
    sendTop.hidden = !touched.length;
    sendTop.disabled = sending;
  }

  function renderSendbar(){
    updateSendTop();
    var pairs = collectPending();
    var waiting = countSentWaiting();

    sendBtn.textContent = sending ? "送信中…" : "回答を送る（" + pairs.length + "件）";
    sendBtn.disabled = sending || !pairs.length;

    resendBtn.hidden = !(waiting && !sending);
    resendBtn.textContent = "送信済み（反映待ち）をまとめて送り直す（" + waiting + "件）";

    updateBulkUndo();

    fallbackEl.hidden = !failedBodies.length;
    if (failedBodies.length) fbTa.value = failedBodies.join("\n\n");

    scheduleBulkLabelUpdate();  // 送信バーの高さが変わりうる＝「この画面」の帯も動く
  }

  // 送信バーの実寸に body の下余白と scroll-padding-bottom を追従させる（幅400で折り返して
  // 3段になる等でバーが高くなっても、最後の行のカードや Enter で移った先の札がバーの下に隠れない）。
  function updateSendbarSpace(){
    var h = sendbar.getBoundingClientRect().height;
    document.documentElement.style.setProperty("--sendbar-h", (h + 16) + "px");
  }
  if (window.ResizeObserver) {
    new ResizeObserver(updateSendbarSpace).observe(sendbar);
  } else {
    window.addEventListener("resize", updateSendbarSpace);
  }
  updateSendbarSpace();

  renderSendbar();
})();
</script>
</body>
</html>
